[tools]
dotnet = "10.0.203"
"dotnet:coverlet.console" = "10.1.0"
"dotnet:csharpier" = "1.3.0"
"github:godotengine/godot" = { version = "4.6.3-stable", asset_pattern = "Godot_v4.6.3-stable_mono_linux_x86_64.zip", rename_exe = "godot-dotnet", checksum = "sha512:962c4f5fd3a704de36c9dedcb2f5f6c973065ac8ed8fd6e12c7ebf7e48c3852d774bcef2ccf76b50b206c0c564ceea54315e2943e76e397529923e7de680508e" }
rust = [
  { version = "1.97.1", components = "rustfmt,clippy" },
  { version = "nightly-2026-06-10", components = "llvm-tools" },
]
just = "1.58.0"
"cargo:cargo-nextest" = "0.9.143"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-llvm-cov" = "0.9.1"
taplo = "0.10.0"
typos = "1.50.1"
python = "3.14.5"
uv = "0.12.10"
"pypi:coverage" = "7.17.0"
ruff = "0.17.2"
dprint = "0.58.0"
rumdl = "0.3.0"
"aqua:rhysd/actionlint" = "1.7.12"
shellcheck = "0.11.0"

[tools."github:Z3Prover/z3"]
version = "5.3.1"
version_prefix = "z3-"
strip_components = 1
bin_path = "bin"

[tools."github:Z3Prover/z3".platforms]
linux-x64 = { asset_pattern = "z3-5.3.1-x64-glibc-2.39.zip", checksum = "sha256:acca9625e8cc8edeb9647b653a1bd696544ddeb5d1c2970a4576734a0c175b40" }

[settings]
# Prefer upstream tool binaries, with source builds as a fallback.
cargo.binstall_native = true

[tasks.verify]
run = "just check"
