[tools]
rust = { version = "1.96.0", components = "rustfmt,clippy" }
just = "1.58.0"
"cargo:cargo-nextest" = "0.9.143"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-machete" = "0.9.2"
taplo = "0.10.0"
typos = "1.50.1"
python = "3.14.5"
"aqua:rhysd/actionlint" = "1.7.12"

[settings]
# Prefer upstream tool binaries, with source builds as a fallback.
cargo.binstall_native = true

[tasks.verify]
run = "just check"
