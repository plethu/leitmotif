[tools]
rust = [
  { version = "1.96.0", components = "rustfmt,clippy" },
  { version = "nightly-2026-06-10", components = "llvm-tools" },
]
just = "1.58.0"
"cargo:cargo-nextest" = "0.9.143"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-llvm-cov" = "0.9.1"
taplo = "0.10.0"
typos = "1.50.1"
python = "3.14.5"
uv = "0.12.10"
"pypi:coverage" = "7.17.0"
ruff = "0.17.2"
dprint = "0.58.0"
rumdl = "0.3.0"
"aqua:rhysd/actionlint" = "1.7.12"
shellcheck = "0.11.0"

[settings]
# Prefer upstream tool binaries, with source builds as a fallback.
cargo.binstall_native = true

[tasks.verify]
run = "just check"
