[package]
name = "symbolic-town"
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
authors = ["Allie"]
repository = "https://github.com/plethu/leitmotif"
description = "Private bounded OxiDD comparison against explicit town exploration"
keywords = ["narrative", "verification", "bdd"]
categories = ["development-tools"]
publish = false

[workspace]

[[bin]]
name = "symbolic_town"
path = "src/main.rs"

[dependencies]
leitmotif = { path = "../../crates/leitmotif", version = "0.1.0-alpha.0" }
oxidd = { version = "=0.13.0", default-features = false, features = [
  "bdd",
  "manager-index",
  "apply-cache-direct-mapped",
] }
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
exit = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
unchecked_time_subtraction = "deny"
as_conversions = "deny"
absolute_paths = "deny"
allow_attributes_without_reason = "deny"
excessive_nesting = "deny"

[patch.crates-io]
oxidd-derive = { git = "https://github.com/plethu/oxidd", rev = "c211b11c3beae9c1e35fa16b7b4871992134404a" }
