[package]
name = "bevy-harbour"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false
authors.workspace = true
repository.workspace = true
description = "Headless Bevy-owned harbour conformance experiment"
readme = "README.md"
keywords = ["narrative", "bevy", "verification"]
categories = ["game-development"]

[dependencies]
thiserror.workspace = true
leitmotif = { path = "../../crates/leitmotif", version = "0.1.0-alpha.0" }
bevy_app = { version = "=0.20.0-dev", git = "https://github.com/bevyengine/bevy", rev = "3a796854abd94144c6e08c4112e5bd9229392b37", default-features = false, features = [
  "std",
] }
bevy_ecs = { version = "=0.20.0-dev", git = "https://github.com/bevyengine/bevy", rev = "3a796854abd94144c6e08c4112e5bd9229392b37", default-features = false, features = [
  "std",
] }

[lints]
workspace = true
