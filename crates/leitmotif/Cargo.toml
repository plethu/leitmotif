[package]
name = "leitmotif"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Experimental Rust-authored narrative models and finite verification"
readme = "../../README.md"
keywords = ["narrative", "verification", "state-machine", "game", "mystery"]
categories = ["game-development", "development-tools"]
publish = false

[features]
default = []
smt = ["dep:rsmt2"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
sha2.workspace = true
base16ct.workspace = true
rsmt2 = { workspace = true, optional = true }

[dev-dependencies]
clap = { workspace = true, features = ["wrap_help"] }

[lints]
workspace = true

[[test]]
name = "town_contracts"
path = "examples/support/town_contracts.rs"

[[test]]
name = "engine_contracts"
path = "examples/support/engine_contracts_contracts.rs"

[[example]]
name = "mystery"
test = true

[[example]]
name = "smt_comparison"
required-features = ["smt"]
