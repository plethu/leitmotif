[graph]
all-features = true

[advisories]
version = 2

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
  { crate = "syn@2.0.119", reason = "Bevy 0.20.1's proc macros use syn 2 while clap_derive uses syn 3" },
  { crate = "hashbrown@0.16.1", reason = "bevy_platform 0.20.1 requires 0.16 while indexmap uses 0.17" },
]

[licenses]
version = 2
confidence-threshold = 0.95
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[[licenses.exceptions]]
name = "atomic-write-file"
version = "=0.3.1"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "gdextension-api"
version = "=0.5.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "godot"
version = "=0.5.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "godot-bindings"
version = "=0.5.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "godot-cell"
version = "=0.5.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "godot-codegen"
version = "=0.5.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "godot-core"
version = "=0.5.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "godot-ffi"
version = "=0.5.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "godot-macros"
version = "=0.5.5"
allow = ["MPL-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/plethu/recite"]

[[licenses.exceptions]]
name = "foldhash"
version = "=0.2.0"
allow = ["Zlib"]

[[licenses.exceptions]]
name = "slotmap"
version = "=1.1.1"
allow = ["Zlib"]
